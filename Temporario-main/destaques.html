<main class="pagina-destaques">
    <h2 class="titulo-destaques">Lista de produtos</h2>

    <div class="filtros">
        <input id="filtroNome" type="text" placeholder="Buscar por nome">
        <input id="precoMinimo" type="number" min="0" step="0.01" placeholder="Preço mínimo">
        <input id="precoMaximo" type="number" min="0" step="0.01" placeholder="Preço máximo">
        <button type="button" onclick="applyFilters()">Buscar</button>
        <button type="button" onclick="resetFilters()">Limpar</button>
    </div>

    <div id="featuredMessage" class="mensagem info" role="status" aria-live="polite" style="display: none;"></div>

    <div id="featuredProducts"></div>
</main>

<script src="script.js"></script>
